services:
  solana-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite database persists across container restarts and updates
      - ./data:/app/data
      # Edit config on the host without rebuilding the image
      - ./config-solana-bot-v1.json:/app/config-solana-bot-v1.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
